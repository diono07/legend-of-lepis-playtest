<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
    <title>樂比斯傳說｜戰鬥原型 v0.7</title>
    <script type="module" crossorigin src="./assets/index-Cw2wP7B7.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-sJH0PEPf.css">
  </head>
  <body>
    <canvas id="game" aria-label="樂比斯傳說戰鬥場景"> </canvas>
    <div id="hud">
      <b>樂比斯傳說 · 戰鬥原型 v0.7</b>
      <div id="stats"></div>
      <div class="state-line">
        <span id="actorState"> </span> · <span id="companionState"> </span>
      </div>
      <div>滑鼠點地移動／指向瞄準 · Q 風暴／W 烈焰／E 穿刺</div>
      <div>空白鍵閃避 · 重生 T · 暫停 P</div>
    </div>
    <div id="controls">
      <button data-mode="manual" class="active">手動</button>
      <button data-mode="semi">半自動</button>
      <button data-mode="auto">全自動</button>
    </div>
    <div id="mobile">
      <div class="pad">
        <span> </span>
        <button data-key="ArrowUp">▲</button>
        <span> </span>
        <button data-key="ArrowLeft">◀</button>
        <span> </span>
        <button data-key="ArrowRight">▶</button>
        <span> </span>
        <button data-key="ArrowDown">▼</button>
        <span> </span>
      </div>
      <div class="actions">
        <button data-key="KeyQ" aria-label="風暴環 Q">
          <kbd>Q</kbd>風暴<small class="skill-status">18 MP</small>
        </button>
        <button data-key="KeyW" aria-label="烈焰印記 W">
          <kbd>W</kbd>烈焰<small class="skill-status">18 MP</small>
        </button>
        <button data-key="KeyE" aria-label="穿刺劍氣 E">
          <kbd>E</kbd>穿刺<small class="skill-status">18 MP</small>
        </button>
        <button data-key="Space" aria-label="空白鍵閃避">
          <kbd>Space</kbd>閃避<small class="skill-status">就緒</small>
        </button>
      </div>
    </div>
    <div id="status">
      v0.7 · 點地移動 × 技能操作 × 樂比斯協同 · <a href="./legacy/v0.6.html">遊玩 v0.6</a> ·
      <a href="./legacy/v0.7-original-controls.html">舊版操作</a>
    </div>
    <div id="runes">
      <strong>符文：1／2／3 選擇 · Q／W／E 施放</strong>
      <button data-rune="storm" class="chosen">1 風暴環</button>
      <button data-rune="flame">2 烈焰印記</button>
      <button data-rune="pierce">3 穿刺劍氣</button>
      <div id="runeDesc">近身範圍攻擊，多目標清怪</div>
      <div style="opacity: 0.8; margin-top: 6px">
        滑鼠指向瞄準；手機拖曳技能按鈕瞄準，放開施放。輕點沿角色面向施放。
      </div>
    </div>
    <div id="pots">
      藥水：<span id="potionCount">HP × 5 ／ MP × 5</span> <button id="healBtn">HP [H]</button>
      <button id="manaBtn">MP [M]</button>
      <button id="pauseBtn" aria-pressed="false">暫停 [P]</button>
      <button id="resetBtn">重生 [T]</button>
    </div>
    <div id="notices"></div>
    <div id="skillFeedback" role="status" aria-live="polite" aria-atomic="true"></div>
  </body>
</html>
