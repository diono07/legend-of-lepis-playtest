  let r=140*(.22+.78*Math.min(1,t*2));ctx.shadowColor='#5ceaff';ctx.shadowBlur=28;
  for(let i=0;i<4;i++){ctx.strokeStyle=['#d7ffff','#7aeaff','#37c7ff','#ffffff'][i];ctx.lineWidth=10-i*2;ctx.beginPath();ctx.arc(0,0,r-i*9,clock*4+i*1.5,clock*4+i*1.5+Math.PI*1.7);ctx.stroke()}
  for(let i=0;i<12;i++){let a=i*Math.PI*2/12+clock*4.5;ctx.strokeStyle=i%2?'#9efaff':'#efffff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(Math.cos(a)*(r-18),Math.sin(a)*(r-18));ctx.lineTo(Math.cos(a)*(r+20+Math.sin(clock*9+i)*8),Math.sin(a)*(r+20+Math.sin(clock*9+i)*8));ctx.stroke()}
 } else if(f.type==='stormHit'){
  ctx.shadowColor='#b0fbff';ctx.shadowBlur=18;for(let i=0;i<6;i++){let a=i*Math.PI/3+t*5;ctx.strokeStyle=i%2?'#e8ffff':'#74ecff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*(8+t*18),Math.sin(a)*(8+t*18));ctx.stroke()}
 } else if(f.type==='flameGround'){
  let r=42+t*95;ctx.globalAlpha*=.8;ctx.fillStyle='rgba(255,90,20,.12)';ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();
  for(let ring=0;ring<2;ring++){ctx.strokeStyle=ring?'#ffcf66':'#ff7030';ctx.lineWidth=3-ring;ctx.shadowColor='#ff7828';ctx.shadowBlur=15;ctx.beginPath();for(let k=0;k<6;k++){let a=(Math.PI/3)*k+clock*.35;let rr=r-(ring*10)+(k%2?5:-5);let xx=Math.cos(a)*rr,yy=Math.sin(a)*rr;if(k===0)ctx.moveTo(xx,yy);else ctx.lineTo(xx,yy)}ctx.closePath();ctx.stroke()}
 } else if(f.type==='flame'){
  let r=165*Math.min(1,t*3.4);ctx.fillStyle='rgba(244,83,22,.16)';ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();
  for(let i=0;i<14;i++){let a=i*Math.PI/7;let rr=r*(.7+.14*Math.sin(clock*7+i));ctx.fillStyle=i%2?'#ffb044':'#ff6126';ctx.beginPath();ctx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr);ctx.lineTo(Math.cos(a+.08)*(rr+24+Math.sin(clock*11+i)*8),Math.sin(a+.08)*(rr+24+Math.sin(clock*11+i)*8));ctx.lineTo(Math.cos(a+.18)*rr,Math.sin(a+.18)*rr);ctx.fill()}
  ctx.strokeStyle='#ffe8a2';ctx.lineWidth=3;ctx.shadowColor='#ffb84a';ctx.shadowBlur=26;ctx.beginPath();ctx.arc(0,0,r*.68,clock*.9,clock*.9+Math.PI*1.85);ctx.stroke();
 } else if(f.type==='flameBurst'){
  ctx.shadowColor='#ff9d48';ctx.shadowBlur=20;for(let i=0;i<7;i++){let a=i*Math.PI/3.5+t*3;ctx.fillStyle=i%2?'#ffd17a':'#ff632f';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*(10+t*22),Math.sin(a)*(10+t*22));ctx.lineTo(Math.cos(a+.18)*(4+t*10),Math.sin(a+.18)*(4+t*10));ctx.closePath();ctx.fill()}
 } else if(f.type==='pierceCharge'){
  ctx.shadowColor='#c7f4ff';ctx.shadowBlur=22;ctx.strokeStyle='#dffcff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-30,0);ctx.lineTo(38,0);ctx.stroke();
  for(let i=0;i<4;i++){ctx.strokeStyle=i%2?'#7ad5ff':'#ffffff';ctx.beginPath();ctx.moveTo(-10-i*14,-12+i*7);ctx.lineTo(28+i*6,-2+i*4);ctx.stroke()}
 } else if(f.type==='pierce'){
  let length=230*Math.min(1,t*4),width=34*(1-t*.58);ctx.shadowColor='#b3efff';ctx.shadowBlur=34;ctx.fillStyle='#4ecbff';ctx.beginPath();ctx.moveTo(0,-width);ctx.lineTo(length,0);ctx.lineTo(0,width);ctx.closePath();ctx.fill();ctx.fillStyle='#efffff';ctx.beginPath();ctx.moveTo(12,-width*.26);ctx.lineTo(length+18,0);ctx.lineTo(12,width*.26);ctx.closePath();ctx.fill();
  for(let i=0;i<6;i++){ctx.strokeStyle=i%2?'#c4f6ff':'#87deff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-25-i*10,(-3+i)*10);ctx.lineTo(length*.82-i*14,(-2+i)*7);ctx.stroke()}
 } else if(f.type==='pierceImpact'){
  ctx.shadowColor='#efffff';ctx.shadowBlur=20;for(let i=0;i<8;i++){let a=i*Math.PI/4+t*6;ctx.strokeStyle=i%2?'#ffffff':'#85dfff';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*(10+t*20),Math.sin(a)*(10+t*20));ctx.stroke()}
 } else if(f.type==='slash'){
  ctx.shadowColor='#fff2a4';ctx.shadowBlur=22;ctx.strokeStyle='#f9f1c2';ctx.lineWidth=11*(1-t);ctx.beginPath();ctx.arc(0,0,60,-1.2+t*.6,1.2+t*.6);ctx.stroke();ctx.strokeStyle='#ffffff';ctx.lineWidth=3;ctx.stroke();
 } else if(f.type==='hitSpark'){
  ctx.shadowColor='#fff4b3';ctx.shadowBlur=18;for(let i=0;i<5;i++){let a=-.7+i*.35+t*2.5;ctx.strokeStyle=i%2?'#ffffff':'#ffe48a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*(10+t*10),Math.sin(a)*(10+t*10));ctx.stroke()}
 }
 ctx.restore()
}
}
function paintScreenFx(){
 for(const fx of screenFx){
  const t=fx.life/fx.max;ctx.save();ctx.globalAlpha=t*fx.power;let color='255,255,255';if(fx.kind==='orange')color='255,124,54';else if(fx.kind==='cyan')color='96,232,255';ctx.fillStyle=`rgba(${color},${.16+t*.18})`;ctx.fillRect(0,0,W,H);ctx.globalAlpha=t*0.35;let g=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*0.45);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(0,0,0,.6)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.restore();
 }
}
function draw(){ctx.fillStyle='#101e28';ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(W/2-p.x+rnd(-shake,shake),H/2-p.y+rnd(-shake,shake));terrain();
let actors=[...enemies.map(e=>({y:e.y,type:'enemy',o:e})),{y:pet.y,type:'pet',o:pet},{y:p.y,type:'hero',o:p}].sort((a,b)=>a.y-b.y);
for(const actor of actors){let e=actor.o;ctx.fillStyle='#11292c';ctx.beginPath();ctx.ellipse(e.x,e.y+8,actor.type==='enemy'&&e.kind==='boss'?36:20,7,0,0,7);ctx.fill();if(actor.type==='hero'){let moving=keys.has('KeyW')||keys.has('KeyA')||keys.has('KeyS')||keys.has('KeyD')||mode==='auto';ctx.save();ctx.translate(p.x,p.y);ctx.scale(Math.cos(p.dir)<-.2?-1:1,1);sprite(0,Math.sin(clock*12)*(moving?2:0)+9,heroArt,{H:'#543e43',F:'#e7c7a1',E:'#23333c',A:'#e2b86c',B:p.inv?'#f2f9ff':'#397eaa',S:'#8bacc2',L:'#283c61'},3);ctx.restore();ctx.strokeStyle='#cfefff';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(p.x+Math.cos(p.dir)*8,p.y+Math.sin(p.dir)*8-8);ctx.lineTo(p.x+Math.cos(p.dir)*31,p.y+Math.sin(p.dir)*31-8);ctx.stroke()}else if(actor.type==='pet'){sprite(pet.x,pet.y+7+Math.sin(clock*5)*2,petArt,{G:'#69cc8b',L:'#387e65',E:'#fff1b4'},3)}else{let art=e.kind==='boss'?bossArt:e.kind==='bat'?batArt:e.kind==='golem'?golemArt:slimeArt;let pal=e.kind==='golem'?{S:'#879ca1',E:'#ffe8a4'}:{P:e.hit?'#fff0ac':e.kind==='boss'?'#9560c5':e.kind==='bat'?'#ad80bc':'#db738e',W:'#fff3df',V:'#59436f'};sprite(e.x,e.y+8+(e.kind==='bat'?Math.sin(clock*6+e.phase)*7:Math.sin(clock*3+e.phase)*2),art,pal,e.kind==='boss'?5:3);px(e.x-21,e.y-41,e.kind==='boss'?44:42,5,'#17242d');px(e.x-20,e.y-40,40*Math.max(0,e.hp/e.max),3,'#ed777c');if(e.kind==='boss'&&e.windup!==undefined){ctx.strokeStyle='#f04cff';ctx.lineWidth=3;ctx.globalAlpha=.5+.3*Math.sin(clock*14);ctx.beginPath();ctx.arc(e.x,e.y,120,0,7);ctx.stroke();ctx.globalAlpha=1}}}
paintEffects();for(const s of slashes){if(s.skill)continue;ctx.save();ctx.globalAlpha=Math.min(1,s.life*5);ctx.strokeStyle=s.skill?(s.rune==='flame'?'#ff934b':s.rune==='pierce'?'#c5e8ff':'#6deaff'):'#f6e7ab';ctx.lineWidth=s.skill?9:6;ctx.shadowBlur=22;ctx.shadowColor=ctx.strokeStyle;ctx.beginPath();ctx.arc(s.x,s.y,s.skill?(s.rune==='pierce'?70:110):52,s.skill&&s.rune!=='pierce'?0:s.dir-.85,s.skill&&s.rune!=='pierce'?Math.PI*2:s.dir+.85);ctx.stroke();ctx.restore()}for(const q of texts){ctx.globalAlpha=Math.min(1,q.life*2);ctx.font='bold 17px system-ui';ctx.textAlign='center';ctx.fillStyle='#fff0b4';ctx.strokeStyle='#271b2c';ctx.lineWidth=3;ctx.strokeText(q.value,q.x,q.y);ctx.fillText(q.value,q.x,q.y)}ctx.globalAlpha=1;for(const q of particles){ctx.globalAlpha=Math.min(1,q.life*2);px(q.x,q.y,4,4,q.color)}ctx.globalAlpha=1;ctx.restore();paintScreenFx();let barW=Math.min(180,W*.23);function bar(x,y,val,max,color,label){ctx.fillStyle='#101922';ctx.fillRect(x,y,barW,20);ctx.fillStyle=color;ctx.fillRect(x+2,y+2,(barW-4)*val/max,16);ctx.fillStyle='white';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillText(`${label} ${Math.ceil(val)}/${max}`,x+barW/2,y+14)}bar(16,H-66,p.hp,100,'#c64652','HP');bar(W-barW-16,H-66,p.mp,80,'#3877cb','MP');bar(W/2-barW/2,H-66,p.soul,100,'#c7a347','SOUL');stats.textContent=`符文：${{storm:'風暴環',flame:'烈焰印記',pierce:'穿刺劍氣'}[rune]}｜擊敗 ${p.kills} 隻｜敵人 ${enemies.length} 隻｜連擊 ${comboTime>0?combo:0}｜模式：${{manual:'手動',semi:'半自動',auto:'全自動'}[mode]}${p.hp<=0?'｜已倒下，按 R 重生':''}`}
function loop(t){let dt=Math.min((t-last)/1000,.05);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
