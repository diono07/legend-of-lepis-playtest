<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
    <title>樂比斯傳說｜戰鬥原型 v0.7.1</title>
    <script type="module" crossorigin src="./assets/index-Cq9Ue0Fy.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CSFc5_Q0.css">
  </head>
  <body>
    <canvas id="game" aria-label="樂比斯傳說戰鬥場景"> </canvas>
    <div id="hud">
      <b>樂比斯傳說 · 戰鬥原型 v0.7.1</b>
      <div id="stats"></div>
      <div class="state-line">
        <span id="actorState"> </span> · <span id="companionState"> </span>
      </div>
      <div>WASD 移動／滑鼠瞄準 · Q 風暴／E 烈焰／F 穿刺</div>
      <div>空白鍵閃避 · 重生 T · 暫停 P</div>
    </div>
    <div id="controls">
      <button data-mode="manual" class="active">手動</button>
      <button data-mode="semi">半自動</button>
      <button data-mode="auto">全自動</button>
    </div>
    <div id="mobile">
      <div id="joystick" class="pad" role="group" aria-label="移動搖桿" data-active="false">
        <span class="joystick-thumb"></span>
        <span class="joystick-label">移動</span>
      </div>
      <div class="actions">
        <button data-key="KeyQ" aria-label="風暴環 Q">
          <kbd>Q</kbd>風暴<small class="skill-status">18 MP</small>
        </button>
        <button data-key="KeyE" aria-label="烈焰印記 E">
          <kbd>E</kbd>烈焰<small class="skill-status">18 MP</small>
        </button>
        <button data-key="KeyF" aria-label="穿刺劍氣 F">
          <kbd>F</kbd>穿刺<small class="skill-status">18 MP</small>
        </button>
        <button data-key="Space" aria-label="空白鍵閃避">
          <kbd>Space</kbd>閃避<small class="skill-status">就緒</small>
        </button>
      </div>
    </div>
    <div id="status">
      v0.7.1 · WASD／搖桿 × 技能操作 × 樂比斯協同 · <a href="./legacy/v0.6.html">遊玩 v0.6</a> ·
      <a href="./legacy/v0.7-stable.html">穩定版 v0.7</a>
    </div>
    <div id="runes">
      <strong>符文：1／2／3 選擇 · Q／E／F 施放</strong>
      <button data-rune="storm" class="chosen">1 風暴環</button>
      <button data-rune="flame">2 烈焰印記</button>
      <button data-rune="pierce">3 穿刺劍氣</button>
      <div id="runeDesc">近身範圍攻擊，多目標清怪</div>
      <div style="opacity: 0.8; margin-top: 6px">
        滑鼠指向瞄準；手機左搖桿移動、拖曳技能按鈕瞄準，放開施放。輕點沿角色面向施放。
      </div>
    </div>
    <div id="pots">
      <span class="potion-label">藥水：<span id="potionCount">HP × 5 ／ MP × 5</span></span>
      <button id="healBtn">HP [H]</button>
      <button id="manaBtn">MP [M]</button>
      <button id="pauseBtn" aria-pressed="false">暫停 [P]</button>
      <button id="resetBtn">重生 [T]</button>
    </div>
    <div id="notices"></div>
    <div id="skillFeedback" role="status" aria-live="polite" aria-atomic="true"></div>
  </body>
</html>
